<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration - Student Hub</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>

  <body>
    <div class="container register-container">
      <header class="form-header">
        <div class="header-top-row">
          <span class="badge">Registration Portal</span>
          <button type="button" class="theme-toggle-btn" aria-label="Toggle dark/light theme">
            <span class="theme-icon">🌙</span>
            <span class="theme-text">Dark mode</span>
          </button>
        </div>
        <h1>Student Registration</h1>
        <p class="subtitle">Please fill in your details according to official university records</p>
      </header>

      <form id="registrationForm" action="DASHBOARD.HTML" method="get">
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="Enter 10-digit mobile number"
              pattern="[0-9]{10}"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password (min 6 chars)"
              minlength="6"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm password again"
              minlength="6"
              required
            />
          </div>

          <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course" required>
              <option value="">Select Course</option>
              <option value="BCA">BCA</option>
              <option value="BBA">BBA</option>
              <option value="BTech">B.Tech</option>
              <option value="MCA">MCA</option>
            </select>
          </div>

          <div class="form-group">
            <label for="year">Year of Study</label>
            <select id="year" name="year" required>
              <option value="">Select Year</option>
              <option value="1">First Year</option>
              <option value="2">Second Year</option>
              <option value="3">Third Year</option>
              <option value="4">Fourth Year</option>
            </select>
          </div>

          <div class="form-group full-width radio-group">
            <label class="group-label">Gender</label>
            <div class="radio-options">
              <label class="radio-label">
                <input type="radio" id="male" name="gender" value="Male" required />
                <span>Male</span>
              </label>
              <label class="radio-label">
                <input type="radio" id="female" name="gender" value="Female" />
                <span>Female</span>
              </label>
              <label class="radio-label">
                <input type="radio" id="other" name="gender" value="Other" />
                <span>Other</span>
              </label>
            </div>
          </div>

          <div class="form-group full-width terms">
            <label class="checkbox-label" for="terms">
              <input type="checkbox" id="terms" name="terms" required />
              <span>I accept the terms and conditions and confirm all details are accurate.</span>
            </label>
          </div>
        </div>

        <div class="buttons">
          <input type="submit" value="Register Now" />
          <input type="reset" value="Clear Form" />
        </div>
      </form>

      <div class="form-footer-nav">
        <a href="../home.html" class="home-btn">← Back to Home</a>
      </div>

      <hr />

      <footer>
        <p>&copy; 2026 Student Hub. All Rights Reserved.</p>
      </footer>
    </div>

    <script src="../JS/SCRIPT.JS"></script>
  </body>
</html>
